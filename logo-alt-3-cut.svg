<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Clipmax Pro cut logo">
  <defs>
    <linearGradient id="a3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0a12"/>
      <stop offset="1" stop-color="#0d0609"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#a3)"/>
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="#f2c14e" stroke-opacity=".3" stroke-width="3"/>

  <!-- Two scissor blades forming an X -->
  <path d="M 168 128 L 344 284" stroke="#f2c14e" stroke-width="34" stroke-linecap="round"/>
  <path d="M 344 128 L 168 284" stroke="#f2c14e" stroke-width="34" stroke-linecap="round"/>
  <!-- Blade pivots -->
