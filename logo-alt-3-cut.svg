  <circle cx="348" cy="124" r="20" fill="#14070d" stroke="#f2c14e" stroke-width="8"/>
  <!-- Center play button -->
  <circle cx="256" cy="206" r="50" fill="#f5eee3"/>
  <path d="M 246 182 L 246 230 L 282 206 Z" fill="#14070d"/>

  <text x="256" y="392" text-anchor="middle"
